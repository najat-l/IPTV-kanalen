name: Update IPTV M3U Playlists

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4[cite: 8]

      - name: Python instellen
        uses: actions/setup-python@v5[cite: 8]
        with:
          python-version: '3.10'[cite: 8]

      - name: Installeer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installeer yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Update SNRT M3U uitvoeren
        run: python update_snrt.py[cite: 8]

      - name: Update Kanalen M3U uitvoeren
        run: python update_kanalen.py[cite: 8]

      - name: Wijzigingen opslaan in GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add snrt.m3u kanalen.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatische update van snrt.m3u en kanalen.m3u tokens" && git push)[cite: 8]
