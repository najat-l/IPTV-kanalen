name: Update IPTV M3U Playlists

concurrency:
  group: update-kanalen
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update SNRT M3U uitvoeren
        run: python update_snrt.py

      - name: Update Kanalen M3U uitvoeren
        run: python update_kanalen.py

      - name: Wijzigingen opslaan in GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git fetch origin main
          git rebase origin/main
          git add snrt.m3u kanalen.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatische update van M3U playlists" && git push)
