name: Update IPTV M3U Playlists

concurrency:
  group: update-kanalen
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installeer yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Update SNRT M3U uitvoeren
        run: python update_snrt.py

      - name: Update Kanalen M3U uitvoeren
        run: python update_kanalen.py

      - name: YouTube Cookies bestand veilig aanmaken
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python -c "
          raw = os.environ.get('YT_COOKIES', '')
          # Schoon eventuele Windows regeleinden op en filter lege regels weg
          lines = [line.strip('\r') for line in raw.splitlines() if line.strip()]
          with open('cookies.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('Cookies succesvol geschreven. Aantal regels:', len(lines))
          "

      - name: Debug cookies bestand
        run: |
          echo "Controleren of cookies.txt bestaat en inhoud heeft:"
          ls -la cookies.txt
          echo "Eerste regel van het bestand:"
          head -n 2 cookies.txt

      - name: Update YouTube M3U test uitvoeren
        run: python update_youtube.py

      - name: Wijzigingen opslaan in GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add snrt.m3u kanalen.m3u youtube.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatische update van M3U playlists en YouTube test" && git push)
